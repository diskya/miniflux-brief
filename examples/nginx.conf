# Mounting feedsum on the Miniflux origin, for nginx.
#
# Miniflux's Content-Security-Policy is `connect-src 'self'`, so the custom JS
# that draws the Brief button can only call the origin Miniflux is served from.
# Putting feedsum under /_summary on that same origin is what makes the button
# work — and it means whatever authenticates Miniflux authenticates these calls
# too, so no API token ever has to reach the page.

server {
    listen 443 ssl;
    server_name feeds.example.com;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    # The trailing slash on proxy_pass is what strips the /_summary prefix.
    location /_summary/ {
        proxy_pass http://127.0.0.1:8012/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A brief can take a minute and a half to generate; the page polls, but
        # the first request still waits for the queue to accept the job.
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
