# A forward-only reader proxy. Destination ACLs are evaluated after Squid does
# DNS resolution; the browser never resolves or connects to an origin itself.
http_port 3128
pid_filename /run/squid/squid.pid

acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80 443
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Names that should be rejected even before/without useful DNS answers.
acl blocked_name dstdomain .localhost .local .internal
http_access deny blocked_name

# Non-public, special-purpose, documentation, benchmarking, multicast and
# reserved IPv4 destinations. This includes every common cloud metadata range.
acl blocked_v4 dst 0.0.0.0/8
acl blocked_v4 dst 10.0.0.0/8
acl blocked_v4 dst 100.64.0.0/10
acl blocked_v4 dst 127.0.0.0/8
acl blocked_v4 dst 169.254.0.0/16
acl blocked_v4 dst 172.16.0.0/12
acl blocked_v4 dst 192.0.0.0/24
acl blocked_v4 dst 192.0.2.0/24
acl blocked_v4 dst 192.31.196.0/24
acl blocked_v4 dst 192.52.193.0/24
acl blocked_v4 dst 192.88.99.0/24
acl blocked_v4 dst 192.168.0.0/16
acl blocked_v4 dst 192.175.48.0/24
acl blocked_v4 dst 198.18.0.0/15
acl blocked_v4 dst 198.51.100.0/24
acl blocked_v4 dst 203.0.113.0/24
acl blocked_v4 dst 224.0.0.0/4
acl blocked_v4 dst 240.0.0.0/4
http_access deny blocked_v4

# IPv6 unspecified, loopback, translation-local, discard, transition,
# benchmarking, documentation, unique-local, link-local and multicast ranges.
acl blocked_v6 dst ::/128
acl blocked_v6 dst ::1/128
acl blocked_v6 dst 64:ff9b:1::/48
acl blocked_v6 dst 100::/64
acl blocked_v6 dst 2001::/32
acl blocked_v6 dst 2001:2::/48
acl blocked_v6 dst 2001:10::/28
acl blocked_v6 dst 2001:db8::/32
acl blocked_v6 dst fc00::/7
acl blocked_v6 dst fe80::/10
acl blocked_v6 dst ff00::/8
http_access deny blocked_v6

http_access allow all
http_access deny all

cache deny all
visible_hostname reader-egress-proxy
forwarded_for delete
via off
# Article URLs may themselves contain credentials in query parameters. Do not
# write request URLs to disk or stdout.
access_log none
cache_log /dev/stdout
coredump_dir none
