[project]
name = "miniflux-brief"
version = "0.1.0"
description = "Summarize every Miniflux entry on arrival, so the unread list is the digest"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["miniflux", "rss", "summarization", "llm", "gemini"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# The bundled article reader. Separate because it pulls in a browser stack that
# feedsum itself never needs — the two run as separate services.
reader = [
    "scrapling[fetchers]>=0.4.14",
    "trafilatura>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/diskya/miniflux-brief"
Issues = "https://github.com/diskya/miniflux-brief/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["feedsum", "reader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Both services are imported from the repo root rather than installed.
pythonpath = ["."]
asyncio_mode = "strict"
