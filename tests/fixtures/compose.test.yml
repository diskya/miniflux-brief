services:
  canary:
    image: python:3.12-slim
    command: ["python", "-m", "http.server", "80"]
    user: "65534:65534"
    networks:
      proxy-outbound:
        aliases:
          - rebind.test
    read_only: true
    tmpfs:
      - /tmp:size=2m,uid=65534,gid=65534
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 32m
